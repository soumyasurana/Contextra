[package]
name = "ingestion"
version = "0.1.0"
edition = "2024"

[dependencies]
embeddings = { path = "../embeddings" }
errors = { path = "../errors" }
lopdf = { version = "0.47", default-features = false }
scraper = { version = "0.29", default-features = false }
serde_json = "1"
storage = { path = "../storage" }
types = { path = "../types" }
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
async-trait = "0.1"
tempfile = { workspace = true }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
